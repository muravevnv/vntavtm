<div x-show="openSentProjectPopup" x-cloak role="dialog" aria-modal="true"
  class="fixed inset-0 w-[100vw] h-[100svh] z-50 overflow-y-auto md:overflow-hidden" data-popup-scrollable>
  <div class="absolute inset-0 size-full bg-[#00000066] z-0"></div>
  <div class="w-full h-full min-h-full overflow-y-auto p-5 md:p-0 md:pt-6">
    <div class="w-full min-h-full flex flex-col items-center justify-center md:justify-end">
      <div x-show="openSentProjectPopup" x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:scale-95" class="relative max-w-[730px] w-full p-8 bg-white rounded-3xl z-2 
      lg:max-w-[578px] lg:pt-4 lg:pb-5 lg:px-6 md:max-w-full md:rounded-b-none 
      md:pb-0 md:pt-0"
        data-popup-scrollable-section>
        <div class="w-full flex items-center justify-between pb-4 lg:pb-3 md:top-0 md:w-[calc(100%+48px)] 
        md:z-1 md:rounded-t-3xl md:px-6 md:-mx-6 md:bg-white md:pt-6 md:pb-4" data-popup-top-panel>
          <h2 class="text-[34px] leading-[130%] text-[#323338] font-bold lg:text-[30px] md:text-2xl">
            Отправить проект
          </h2>
          <button @click="openSentProjectPopup = false; document.body.classList.remove('no-scroll')" type="button" class="flex items-center justify-center size-8 rounded-full 
          bg-[#F4F6FB] text-[#323338] cursor-pointer hover:bg-[#323338] hover:text-white transition-all">
            <svg class="size-[14px]" width="14" height="14" viewBox="0 0 14 14" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path d="M1.6665 1.66699L12.3332 12.3337" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
              <path d="M12.3332 1.66699L1.6665 12.3337" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="text-[17px] leading-[140%] text-[#323338B2] mb-6 lg:mb-4 md:mb-6 md:text-[15px]">
          Пожалуйста, прикрепите свой проект и укажите контактные данные, чтобы мы смогли задать вам уточняющие вопросы
          и направить ответ.
        </div>
        <form action="#" class="w-full flex flex-col gap-6 lg:gap-4 md:gap-0">
          <div class="flex flex-col gap-3">
            <div class="w-full">
              <div class="w-full relative">
                <span class="absolute top-5 left-5 pr-5 border-r-[1px] border-gray md:pr-4">
                  <svg class="size-6 text-[#3B8BEA]" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M21.9999 16.9201V19.9201C22.0011 20.1986 21.944 20.4743 21.8324 20.7294C21.7209 20.9846 21.5572 21.2137 21.352 21.402C21.1468 21.5902 20.9045 21.7336 20.6407 21.8228C20.3769 21.912 20.0973 21.9452 19.8199 21.9201C16.7428 21.5857 13.7869 20.5342 11.1899 18.8501C8.77376 17.3148 6.72527 15.2663 5.18993 12.8501C3.49991 10.2413 2.44818 7.27109 2.11993 4.1801C2.09494 3.90356 2.12781 3.62486 2.21643 3.36172C2.30506 3.09859 2.4475 2.85679 2.6347 2.65172C2.82189 2.44665 3.04974 2.28281 3.30372 2.17062C3.55771 2.05843 3.83227 2.00036 4.10993 2.0001H7.10993C7.59524 1.99532 8.06572 2.16718 8.43369 2.48363C8.80166 2.80008 9.04201 3.23954 9.10993 3.7201C9.23656 4.68016 9.47138 5.62282 9.80993 6.5301C9.94448 6.88802 9.9736 7.27701 9.89384 7.65098C9.81408 8.02494 9.6288 8.36821 9.35993 8.6401L8.08993 9.9101C9.51349 12.4136 11.5864 14.4865 14.0899 15.9101L15.3599 14.6401C15.6318 14.3712 15.9751 14.1859 16.3491 14.1062C16.723 14.0264 17.112 14.0556 17.4699 14.1901C18.3772 14.5286 19.3199 14.7635 20.2799 14.8901C20.7657 14.9586 21.2093 15.2033 21.5265 15.5776C21.8436 15.9519 22.0121 16.4297 21.9999 16.9201Z"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </span>
                <input type="tel" placeholder="+7 (000) 000-00-00" data-required class="w-full outline-0 text-[17px] leading-[140%] bg-[#F4F6FB] border-[2px] border-[#F4F6FB] rounded-2xl 
                  p-[18px] pl-[82px] font-medium text-[#323338] placeholder:text-[#A4A4A4]">
                <span class="hidden text-xs text-[#F55353] mt-[6px]" data-required-error>Обязательное поле для заполнения</span>
              </div>
            </div>
            <div class="w-full">
              <div class="w-full relative">
                <span class="absolute top-5 left-5 pr-5 border-r-[1px] border-gray md:pr-4">
                  <svg class="size-6 text-[#3B8BEA]" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M22 6C22 4.9 21.1 4 20 4H4C2.9 4 2 4.9 2 6M22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6M22 6L12 13L2 6"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </span>
                <input type="email" placeholder="Электронная почта" data-required class="w-full outline-0 text-[17px] leading-[140%] bg-[#F4F6FB] border-[2px] border-[#F4F6FB] rounded-2xl 
                  p-[18px] pl-[82px] font-medium text-[#323338] placeholder:text-[#A4A4A4]">
                <span class="hidden text-xs text-[#F55353] mt-[6px]" data-required-error>Обязательное поле для заполнения</span>
              </div>
            </div>
            <div class="w-full leading-0">
              <textarea name="message" placeholder="Комментарий"
                class="block w-full outline-0 text-[17px] leading-[140%] font-medium px-5 py-4 bg-[#F4F6FB] rounded-2xl h-[120px] text-[#323338] placeholder:text-[#A4A4A4]"></textarea>
            </div>
            <div class="w-full">
              <div
                class="w-full flex items-center justify-between py-2 pl-4 pr-[10px] bg-[#EDEDED] rounded-2xl cursor-pointer">
                <div class="text-[15px] font-medium leading-[140%] text-[#60626C]">VentShield.pdf</div>
                <svg width="32" height="32" viewBox="0 0 33 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M11.5234 10.6667L22.1901 21.3333" stroke="#323338"
                    style="stroke:#323338;stroke:color(display-p3 0.1961 0.2000 0.2196);stroke-opacity:1;"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M22.1901 10.6667L11.5234 21.3333" stroke="#323338"
                    style="stroke:#323338;stroke:color(display-p3 0.1961 0.2000 0.2196);stroke-opacity:1;"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
            </div>
            <div class="w-full flex items-stretch gap-3 md:flex-col">
              <label class="w-full cursor-pointer block" for="id_input_file">
                <input type="file" class="absolute top-0 left-0 opacity-0 w-0 h-0" id="id_input_file">
                <span
                  class="flex items-center justify-center gap-[6px] w-full p-[10px] rounded-[10px] bg-[#EDEDED] text-xs text-[#3B8BEA] font-semibold">
                  <svg width="18" height="18" viewBox="0 0 19 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M9.125 16.5C7.975 16.5 7 16.1 6.2 15.3C5.4 14.5 5 13.525 5 12.375V4.5C5 3.675 5.29375 2.96875 5.88125 2.38125C6.46875 1.79375 7.175 1.5 8 1.5C8.825 1.5 9.53125 1.79375 10.1188 2.38125C10.7063 2.96875 11 3.675 11 4.5V11.625C11 12.15 10.8187 12.5938 10.4563 12.9563C10.0938 13.3188 9.65 13.5 9.125 13.5C8.6 13.5 8.15625 13.3188 7.79375 12.9563C7.43125 12.5938 7.25 12.15 7.25 11.625V4.5H8.375V11.625C8.375 11.8375 8.44687 12.0156 8.59062 12.1594C8.73438 12.3031 8.9125 12.375 9.125 12.375C9.3375 12.375 9.51562 12.3031 9.65938 12.1594C9.80312 12.0156 9.875 11.8375 9.875 11.625V4.5C9.875 3.975 9.69375 3.53125 9.33125 3.16875C8.96875 2.80625 8.525 2.625 8 2.625C7.475 2.625 7.03125 2.80625 6.66875 3.16875C6.30625 3.53125 6.125 3.975 6.125 4.5V12.375C6.125 13.2 6.41875 13.9063 7.00625 14.4938C7.59375 15.0813 8.3 15.375 9.125 15.375C9.95 15.375 10.6562 15.0813 11.2437 14.4938C11.8312 13.9063 12.125 13.2 12.125 12.375V4.5H13.25V12.375C13.25 13.525 12.85 14.5 12.05 15.3C11.25 16.1 10.275 16.5 9.125 16.5Z"
                      fill="#3B8BEA" style="fill:#3B8BEA;fill:color(display-p3 0.2314 0.5451 0.9176);fill-opacity:1;" />
                  </svg>
                  Прикрепить проект
                </span>
              </label>
              <label class="w-full cursor-pointer block" for="id_input_file">
                <input type="file" class="absolute top-0 left-0 opacity-0 w-0 h-0" id="id_input_file">
                <span
                  class="flex items-center justify-center gap-[6px] w-full p-[10px] rounded-[10px] bg-[#EDEDED] text-xs text-[#3B8BEA] font-semibold">
                  <svg width="18" height="18" viewBox="0 0 19 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M9.125 16.5C7.975 16.5 7 16.1 6.2 15.3C5.4 14.5 5 13.525 5 12.375V4.5C5 3.675 5.29375 2.96875 5.88125 2.38125C6.46875 1.79375 7.175 1.5 8 1.5C8.825 1.5 9.53125 1.79375 10.1188 2.38125C10.7063 2.96875 11 3.675 11 4.5V11.625C11 12.15 10.8187 12.5938 10.4563 12.9563C10.0938 13.3188 9.65 13.5 9.125 13.5C8.6 13.5 8.15625 13.3188 7.79375 12.9563C7.43125 12.5938 7.25 12.15 7.25 11.625V4.5H8.375V11.625C8.375 11.8375 8.44687 12.0156 8.59062 12.1594C8.73438 12.3031 8.9125 12.375 9.125 12.375C9.3375 12.375 9.51562 12.3031 9.65938 12.1594C9.80312 12.0156 9.875 11.8375 9.875 11.625V4.5C9.875 3.975 9.69375 3.53125 9.33125 3.16875C8.96875 2.80625 8.525 2.625 8 2.625C7.475 2.625 7.03125 2.80625 6.66875 3.16875C6.30625 3.53125 6.125 3.975 6.125 4.5V12.375C6.125 13.2 6.41875 13.9063 7.00625 14.4938C7.59375 15.0813 8.3 15.375 9.125 15.375C9.95 15.375 10.6562 15.0813 11.2437 14.4938C11.8312 13.9063 12.125 13.2 12.125 12.375V4.5H13.25V12.375C13.25 13.525 12.85 14.5 12.05 15.3C11.25 16.1 10.275 16.5 9.125 16.5Z"
                      fill="#3B8BEA" style="fill:#3B8BEA;fill:color(display-p3 0.2314 0.5451 0.9176);fill-opacity:1;" />
                  </svg>
                  Прикрепить реквизиты
                </span>
              </label>
            </div>
          </div>
          <div class="flex flex-col gap-4 md:bottom-0 md:py-4 md:bg-white md:w-[calc(100%+48px)] 
          md:p-6 md:pb-[18px] md:-mx-6" data-popup-bottom-panel>
            <label class="flex items-start cursor-pointer">
              <input type="checkbox" class="absolute opacity-0 h-0 w-0 peer">
              <span
                class="relative inline-block shrink-0 mr-3 size-5 border-1 border-gray-300 rounded-md bg-no-repeat bg-center peer-checked:bg-[url('../img/icons/checked.svg')] peer-checked:border-[#3B8BEA]"></span>
              <span class="text-[14px] leading-[140%] font-medium">
                Нажимая на кнопку «Отправить», вы подтверждаете своё согласие на <a href="#"
                  class="text-primary hover:underline">обработку персональных данных</a>
              </span>
            </label>
            <button type="submit"
              class="w-full relative z-1 inline-block py-5 px-6 bg-[#3B8BEA] rounded-2xl text-white text-center 
                  font-semibold hover:bg-[#2C6CB8] hover:text-white transition-all cursor-pointer md:text-base md:py-[15px]">
              Отправить
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
