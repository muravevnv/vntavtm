<div x-show="openSuccessOrderPopup" x-cloak role="dialog" aria-modal="true"
  class="fixed inset-0 w-[100vw] h-[100svh] z-50 overflow-y-auto">
  <div class="absolute inset-0 size-full bg-[#00000066] z-0"></div>
  <div class="flex items-center justify-center w-full min-h-screen md:px-4">
    <div x-show="openSuccessOrderPopup" x-transition:enter="ease-out duration-300"
      x-transition:enter-start="opacity-0 translate-y-4 sm:scale-95"
      x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200"
      x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave-end="opacity-0 translate-y-4 sm:scale-95" class="relative max-w-[730px] w-full p-8 bg-white rounded-3xl z-2 
      lg:max-w-[578px] lg:pt-4 lg:pb-5 lg:px-6 md:max-w-full md:p-6">
      <div class="w-full flex flex-col items-center gap-[14px] mb-6 lg:gap-[10px]">
        <div class="w-full flex items-center justify-between">
          <h2 class="text-[34px] mx-auto leading-[130%] text-[#323338] font-bold pl-8 lg:text-[30px] md:text-2xl">
            Спасибо!
          </h2>
          <button @click='openSuccessOrderPopup = false' type="button" class="flex items-center justify-center size-8 rounded-full 
          bg-[#F4F6FB] text-[#323338] cursor-pointer hover:bg-[#323338] hover:text-white transition-all">
            <svg class="size-[14px]" width="14" height="14" viewBox="0 0 14 14" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path d="M1.6665 1.66699L12.3332 12.3337" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
              <path d="M12.3332 1.66699L1.6665 12.3337" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="text-[17px] leading-[140%] text-[#323338] text-center md:text-[15px]">
          Ваш запрос отправлен
        </div>
      </div>
      <button type="button" @click='openSuccessOrderPopup = false'
        class="w-full flex items-center justify-center gap-2 p-5 rounded-2xl 
            font-semibold bg-white border-[2px] border-[#3B8BEA] text-[#3B8BEA] cursor-pointer 
            hover:bg-[#3B8BEA] hover:text-white transition-all">Хорошо</button>
    </div>
  </div>
</div>
