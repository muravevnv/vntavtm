<div x-show="openAccNewPasswordPopup" x-cloak role="dialog" aria-modal="true"
  class="fixed inset-0 w-[100vw] h-[100svh] z-50 overflow-y-auto">
  <div class="absolute inset-0 size-full bg-[#00000066] z-0"></div>
  <div class="flex items-center justify-center w-full min-h-screen md:items-end">
    <div x-show="openAccNewPasswordPopup" x-transition:enter="ease-out duration-300"
      x-transition:enter-start="opacity-0 translate-y-4 sm:scale-95"
      x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200"
      x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave-end="opacity-0 translate-y-4 sm:scale-95" class="relative max-w-[730px] w-full p-8 bg-white rounded-3xl z-2 
      lg:max-w-[578px] lg:pt-4 lg:pb-5 lg:px-6 md:max-w-full md:rounded-b-none md:pt-6 md:pb-[42px]">
      <div class="flex items-center justify-between mb-6 md:items-start">
        <h2 class="text-[34px] leading-[130%] text-[#323338] font-bold lg:text-[30px] md:text-2xl">
          Создание нового пароля
        </h2>
        <button @click='openEnterPopup = false' type="button" class="flex items-center justify-center size-8 rounded-full 
          bg-[#F4F6FB] text-[#323338] cursor-pointer hover:bg-[#323338] hover:text-white transition-all">
          <svg class="size-[14px]" width="14" height="14" viewBox="0 0 14 14" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path d="M1.6665 1.66699L12.3332 12.3337" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M12.3332 1.66699L1.6665 12.3337" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <form action="#" class="w-full flex items-start flex-col gap-6 md:gap-5">
        <div class="w-full flex items-start flex-col gap-3">
          <div class="w-full flex items-start flex-col gap-2">
            <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Введите новый пароль</label>
            <input type="text" placeholder="Введите новый пароль" class="block w-full px-4 py-[18px] bg-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] 
              font-medium rounded-2xl outline-none">
          </div>
          <div class="w-full flex items-start flex-col gap-2">
            <div class="flex items-center justify-between">
              <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Пароль</label>
              <a href="#" class="text-[#3B8BEA] text-sm leading-[140%] font-semibold">Забыли пароль?</a>
            </div>
            <input type="text" placeholder="Введите пароль" class="block w-full px-4 py-[18px] bg-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] 
              font-medium rounded-2xl outline-none">
          </div>
        </div>
        <div class="flex flex-col gap-3 w-full">
          <button type="submit" class="w-full flex items-center justify-center p-5 rounded-2xl bg-[#3B8BEA] 
            font-semibold text-white cursor-pointer hover:bg-[#2C6CB8] transition-all">
           Войти
          </button>
          <button type="button" class="w-full flex items-center justify-center p-[10px] rounded-2xl bg-transparent
            text-[#3B8BEA] font-semibold cursor-pointer hover:underline transition-all">
            Зарегистрироваться
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
