<div x-show="openAskQuestionPopup" x-cloak role="dialog" aria-modal="true"
  class="fixed inset-0 w-[100vw] h-[100svh] z-50 overflow-y-auto">
  <div class="absolute inset-0 size-full bg-[#00000066] z-0"></div>
  <div class="w-full h-full min-h-full overflow-y-auto p-5 md:p-0 md:pt-6">
    <div class="w-full min-h-full flex flex-col items-center justify-center md:justify-end">
      <div x-show="openAskQuestionPopup" x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:scale-95" class="relative max-w-[730px] w-full p-8 bg-white rounded-3xl z-2 
      lg:max-w-[578px] lg:pt-4 lg:pb-5 lg:px-6 md:max-w-full md:rounded-b-none md:pt-6 md:pb-[42px]">
        <div class="w-full flex flex-col items-start mb-6 md:items-start gap-4 lg:gap-3 md:gap-4">
          <div class="w-full flex items-center justify-between">
            <h2 class="text-[34px] leading-[130%] text-[#323338] font-bold lg:text-[30px] md:text-2xl">
              Добро пожаловать! <br>
              Задайте свой вопрос
            </h2>
            <button @click="openAskQuestionPopup = false; document.body.classList.remove('no-scroll')" type="button" class="flex items-center justify-center size-8 rounded-full 
          bg-[#F4F6FB] text-[#323338] cursor-pointer hover:bg-[#323338] hover:text-white transition-all shrink-0">
              <svg class="size-[14px]" width="14" height="14" viewBox="0 0 14 14" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M1.6665 1.66699L12.3332 12.3337" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round" />
                <path d="M12.3332 1.66699L1.6665 12.3337" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </div>
        <form action="#" class="w-full flex items-start flex-col gap-6 md:gap-5">
          <div class="w-full flex items-start flex-col gap-3">
            <div class="w-full flex items-start flex-col gap-2">
              <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Имя</label>
              <input type="text" placeholder="Имя" data-required
                class="block w-full px-4 py-[17px] bg-[#F4F6FB] border-1 border-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
            </div>
            <div class="w-full flex items-start flex-col gap-2">
              <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Телефон</label>
              <input type="tel" placeholder="+7" data-required
                class="block w-full px-4 py-[17px] bg-[#F4F6FB] border-1 border-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
            </div>
            <div class="w-full flex items-start flex-col gap-2">
              <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Электронный адрес</label>
              <input type="text" placeholder="Электронный адрес" data-required
                class="block w-full px-4 py-[17px] bg-[#F4F6FB] border-1 border-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
            </div>
            <div class="w-full flex items-start flex-col gap-2">
              <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Вопрос</label>
              <div class="relative w-full leading-0">
                <textarea name="message" placeholder="Задайте вопрос"
                  class="block w-full outline-0 text-[17px] leading-[140%] font-medium pl-5 py-4 pr-[52px] bg-[#F4F6FB] rounded-2xl h-[120px] text-[#323338] placeholder:text-[#A4A4A4]"></textarea>
                <button type="button" class="absolute top-4 right-5 size-[28px] cursor-pointer">
                  <svg class="size-[28px]" width="28" height="28" viewBox="0 0 28 28" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                      d="M14.0001 5.3668C9.23207 5.3668 5.3668 9.23207 5.3668 14.0001C5.3668 18.7682 9.23207 22.6335 14.0001 22.6335C18.7682 22.6335 22.6335 18.7682 22.6335 14.0001C22.6335 9.23207 18.7682 5.3668 14.0001 5.3668ZM3.9668 14.0001C3.9668 8.45887 8.45887 3.9668 14.0001 3.9668C19.5414 3.9668 24.0335 8.45887 24.0335 14.0001C24.0335 19.5414 19.5414 24.0335 14.0001 24.0335C8.45887 24.0335 3.9668 19.5414 3.9668 14.0001ZM10.6378 17.3166C10.868 17.006 11.3064 16.9409 11.617 17.1711C12.2968 17.675 13.1173 17.9668 14.0001 17.9668C14.883 17.9668 15.7035 17.675 16.3833 17.1711C16.6939 16.9409 17.1323 17.006 17.3625 17.3166C17.5927 17.6272 17.5275 18.0656 17.217 18.2958C16.3094 18.9686 15.1994 19.3668 14.0001 19.3668C12.8008 19.3668 11.6909 18.9686 10.7833 18.2958C10.4727 18.0656 10.4076 17.6272 10.6378 17.3166Z"
                      fill="#5A5B5F" />
                    <path
                      d="M17.7335 12.6001C17.7335 13.3733 17.3156 14.0001 16.8001 14.0001C16.2847 14.0001 15.8668 13.3733 15.8668 12.6001C15.8668 11.8269 16.2847 11.2001 16.8001 11.2001C17.3156 11.2001 17.7335 11.8269 17.7335 12.6001Z"
                      fill="#5A5B5F" />
                    <path
                      d="M12.1335 12.6001C12.1335 13.3733 11.7156 14.0001 11.2001 14.0001C10.6847 14.0001 10.2668 13.3733 10.2668 12.6001C10.2668 11.8269 10.6847 11.2001 11.2001 11.2001C11.7156 11.2001 12.1335 11.8269 12.1335 12.6001Z"
                      fill="#5A5B5F" />
                  </svg>
                </button>
                <button type="button" class="absolute top-[54px] right-5 size-[28px] cursor-pointer">
                  <svg class="size-[28px]" width="19" height="18" viewBox="0 0 19 18" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M9.125 16.5C7.975 16.5 7 16.1 6.2 15.3C5.4 14.5 5 13.525 5 12.375V4.5C5 3.675 5.29375 2.96875 5.88125 2.38125C6.46875 1.79375 7.175 1.5 8 1.5C8.825 1.5 9.53125 1.79375 10.1188 2.38125C10.7063 2.96875 11 3.675 11 4.5V11.625C11 12.15 10.8187 12.5938 10.4563 12.9563C10.0938 13.3188 9.65 13.5 9.125 13.5C8.6 13.5 8.15625 13.3188 7.79375 12.9563C7.43125 12.5938 7.25 12.15 7.25 11.625V4.5H8.375V11.625C8.375 11.8375 8.44687 12.0156 8.59062 12.1594C8.73438 12.3031 8.9125 12.375 9.125 12.375C9.3375 12.375 9.51562 12.3031 9.65938 12.1594C9.80312 12.0156 9.875 11.8375 9.875 11.625V4.5C9.875 3.975 9.69375 3.53125 9.33125 3.16875C8.96875 2.80625 8.525 2.625 8 2.625C7.475 2.625 7.03125 2.80625 6.66875 3.16875C6.30625 3.53125 6.125 3.975 6.125 4.5V12.375C6.125 13.2 6.41875 13.9063 7.00625 14.4938C7.59375 15.0813 8.3 15.375 9.125 15.375C9.95 15.375 10.6562 15.0813 11.2437 14.4938C11.8312 13.9063 12.125 13.2 12.125 12.375V4.5H13.25V12.375C13.25 13.525 12.85 14.5 12.05 15.3C11.25 16.1 10.275 16.5 9.125 16.5Z"
                      fill="#5A5B5F" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="flex flex-col gap-3">
            <label class="flex items-start cursor-pointer">
              <input type="checkbox" class="absolute opacity-0 h-0 w-0 peer" data-required>
              <span
                class="relative inline-block shrink-0 mr-3 size-5 border-1 border-gray-300 rounded-md bg-no-repeat bg-center peer-checked:bg-[url('../img/icons/checked.svg')] peer-checked:border-[#3B8BEA]"></span>
              <span class="text-[14px] leading-[140%] font-medium">
                Нажимая на кнопку «Отправить», вы подтверждаете своё согласие на <a href="#"
                  class="text-primary hover:underline">обработку персональных данных</a>
              </span>
            </label>
            <button type="submit" class="w-full flex items-center justify-center gap-2 p-5 rounded-2xl bg-primary 
            font-semibold text-white cursor-pointer hover:bg-[#2C6CB8] transition-all">
              Отправить
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
