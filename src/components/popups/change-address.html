<div x-show="openChangeAddressPopup" x-cloak role="dialog" aria-modal="true"
  class="fixed inset-0 w-[100vw] h-[100svh] z-50 overflow-y-auto" data-popup-scrollable>
  <div class="absolute inset-0 size-full bg-[#00000066] z-0"></div>
  <div class="w-full h-full min-h-full overflow-y-auto p-5 md:p-0 md:pt-6">
    <div class="w-full min-h-full flex flex-col items-center justify-center md:justify-end">
      <div x-show="openChangeAddressPopup" x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:scale-95" class="relative max-w-[730px] w-full p-8 bg-white rounded-3xl z-2 
        lg:max-w-[578px] lg:pt-4 lg:pb-5 lg:px-6 md:max-w-full md:rounded-b-none md:p-6">
        <div class="flex items-center justify-between mb-6 md:items-start">
          <h2 class="text-[34px] leading-[130%] text-[#323338] font-bold lg:text-[30px] md:text-2xl">
            Изменить адрес доставки
          </h2>
          <button @click="openChangeAddressPopup = false; document.body.classList.remove('no-scroll')" type="button" class="flex items-center justify-center size-8 rounded-full 
          bg-[#F4F6FB] text-[#323338] cursor-pointer shrink-0 hover:bg-[#323338] hover:text-white transition-all">
            <svg class="size-[14px]" width="14" height="14" viewBox="0 0 14 14" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path d="M1.6665 1.66699L12.3332 12.3337" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
              <path d="M12.3332 1.66699L1.6665 12.3337" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="w-full mb-6 md:mb-4">
          <div class="w-full flex items-center p-[6px] bg-[#EDEDED] rounded-2xl md:max-w-full">
            <button type="button" data-tabs-btn="to-address"
              class="w-full p-[9px] text-[#3B8BEA] rounded-[9px] text-center text-sm leading-[140%] font-semibold cursor-pointer is-active">
              <span class="md:hidden">Доставка до адреса</span>
              <span class="hidden md:block">До адреса</span>
            </button>
            <button type="button" data-tabs-btn="to-pickpoint"
              class="w-full p-[9px] text-[#3B8BEA] rounded-[9px] text-center text-sm leading-[140%] font-semibold cursor-pointer">
              <span class="md:hidden">Доставка до отделения</span>
              <span class="hidden md:block">До отделения</span>
            </button>
          </div>
        </div>
        <div class="w-full" data-tabs-content="to-address">
          <form action="#" class="w-full flex items-start flex-col gap-6 md:gap-4">
            <div class="w-full flex flex-col gap-4">
              <div class="w-full flex items-start flex-col gap-3">
                <div class="w-full flex items-start flex-col gap-2">
                  <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Ваш адрес</label>
                  <input type="text" placeholder="Ваш адрес"
                    class="block w-full px-4 py-[18px] bg-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
                </div>
                <div class="w-full grid grid-cols-4 gap-3 md:grid-cols-2">
                  <input type="text" placeholder="Офис"
                    class="block w-full px-4 py-[18px] bg-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
                  <input type="text" placeholder="Подъезд"
                    class="block w-full px-4 py-[18px] bg-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
                  <input type="text" placeholder="Этаж"
                    class="block w-full px-4 py-[18px] bg-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
                  <input type="text" placeholder="Домофон"
                    class="block w-full px-4 py-[18px] bg-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
                </div>
              </div>
            </div>
            <div
              class="w-full flex items-center gap-3">
              <button type="button" class="w-full flex items-center justify-center gap-2 p-[18px] rounded-2xl bg-white 
            border-[2px] border-[#3B8BEA] text-[#3B8BEA]
            font-semibold cursor-pointer hover:bg-[#2C6CB8] hover:border-[#2C6CB8] hover:text-white transition-all md:p-[13px]">
                Отменить
              </button>
              <button type="submit" class="w-full flex items-center justify-center gap-2 p-5 rounded-2xl bg-primary 
            font-semibold text-white cursor-pointer hover:bg-[#2C6CB8] transition-all md:p-[15px]">
                Сохранить
              </button>
            </div>
          </form>
        </div>
        <div class="w-full hidden" data-tabs-content="to-pickpoint">
          <div class="flex flex-col items-start mb-4">
            <div class="text-sm leading-[140%] font-medium mb-2">Выбрать пункт выдачи</div>
            <div class="text-sm leading-[140%] font-semibold">СДЭК Москва, ул. Сходненская, д.8</div>
          </div>
          <button type="submit" class="w-full flex items-center justify-center gap-2 p-3 rounded-2xl bg-[#3B8BEA1A] text-[#3B8BEA]
            font-semibold cursor-pointer hover:bg-[#3B8BEA] hover:text-white transition-all">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7.50016 15.834V3.33398" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M12.5002 11.666V17.413" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              <path
                d="M17.5 10.834V15.2774C17.5008 15.6356 17.2719 15.9539 16.9321 16.0673C15.851 16.4277 13.5355 17.1997 12.7595 17.4585C12.5897 17.5151 12.4059 17.5146 12.2363 17.4572L7.76355 15.9661C7.59248 15.909 7.40752 15.909 7.23645 15.9661L3.59688 17.1794C3.34276 17.2641 3.0634 17.2215 2.84609 17.0649C2.62877 16.9083 2.5 16.6567 2.5 16.3888V5.51128C2.5 5.1526 2.72951 4.83416 3.06978 4.72072L6.97289 3.41952C7.31503 3.30547 7.68492 3.30547 8.02706 3.41952L9.16667 3.79942"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              <path
                d="M11.6665 5.41602C11.6665 6.78144 13.1565 8.24002 14.0065 8.96131C14.3422 9.23424 14.8233 9.23424 15.159 8.96131C16.0098 8.24002 17.4998 6.78144 17.4998 5.41602"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              <path
                d="M14.584 5.20834C14.699 5.2088 14.7918 5.30228 14.7915 5.41723C14.7912 5.53218 14.6978 5.62516 14.5829 5.625C14.4679 5.62485 14.3748 5.53162 14.3748 5.41667C14.3745 5.36118 14.3965 5.3079 14.4358 5.26874C14.4751 5.22958 14.5285 5.20782 14.584 5.20834"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              <path
                d="M11.6665 5.41667V5.41667C11.6665 3.80584 12.9723 2.5 14.5832 2.5V2.5C16.194 2.5 17.4998 3.80584 17.4998 5.41667V5.41667"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Выбрать пункт выдачи
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
