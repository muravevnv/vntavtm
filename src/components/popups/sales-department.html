<div x-show="openSalesDepartmentPopup" x-cloak role="dialog" aria-modal="true"
  class="fixed inset-0 w-[100vw] h-[100svh] z-50 overflow-y-auto">
  <div class="absolute inset-0 size-full bg-[#00000066] z-0"></div>
  <div class="w-full h-full min-h-full overflow-y-auto py-6 px-3">
    <div class="w-full min-h-full flex flex-col items-center justify-center md:justify-end">
      <div x-show="openSalesDepartmentPopup" x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:scale-95"
        class="relative max-w-[680px] w-full p-8 bg-white rounded-3xl z-2 lg:max-w-[578px] lg:p-6 md:max-w-full md:p-4 md:rounded-2xl">
        <div class="w-full flex flex-col items-center">
          <div class="w-full flex items-center justify-between mb-6 md:items-start">
            <h2 class="text-[34px] leading-[130%] text-[#323338] font-bold lg:text-[30px] md:text-2xl">
              Отдел продаж
            </h2>
            <button @click="openSalesDepartmentPopup = false; document.body.classList.remove('no-scroll')" type="button" class="flex items-center justify-center size-8 rounded-full 
          bg-[#F4F6FB] text-[#323338] cursor-pointer hover:bg-[#323338] hover:text-white transition-all shrink-0">
              <svg class="size-[14px]" width="14" height="14" viewBox="0 0 14 14" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M1.6665 1.66699L12.3332 12.3337" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round" />
                <path d="M12.3332 1.66699L1.6665 12.3337" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <div class="w-full flex flex-col items-center gap-3">
            <button type="submit" class="w-full relative z-1 inline-block py-[18px] px-4 bg-[#3B8BEA] rounded-2xl text-white text-center 
                  font-semibold hover:bg-[#2C6CB8] hover:text-white transition-all cursor-pointer">
              Заказать звонок
            </button>
            <div class="flex flex-col items-center text-center">
              <div class="text-[17px] text-[#32333880] font-medium leading-[140%]">Телефон отдела продаж:</div>
              <a href="tel:+78005517668" class="text-lg leadin-[140%] font-semibold text-[#3B8BEA]">+7 (800) 551-76-68</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
