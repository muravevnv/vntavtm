<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/swiper-bundle.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/main.css">
</head>

<body class="text-graphite bg-[#F4F6FB] md:bg-white">
  @@include('header.html')
  @@include('menu.html')
  <main>
    <section class="pt-[13px] lg:pt-3">
      <div class="my-container">
        <a href="#" class="flex items-center gap-[10px] text-[#3B8BEA]">
          <svg width="19" height="18" viewBox="0 0 19 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.39648 9L16.6465 9" stroke="#3B8BEA"
              style="stroke:#3B8BEA;stroke:color(display-p3 0.2314 0.5451 0.9176);stroke-opacity:1;" stroke-width="1.5"
              stroke-linecap="square" stroke-linejoin="round" />
            <path d="M6.14648 13.5L1.64648 9" stroke="#3B8BEA"
              style="stroke:#3B8BEA;stroke:color(display-p3 0.2314 0.5451 0.9176);stroke-opacity:1;" stroke-width="1.5"
              stroke-linecap="square" stroke-linejoin="round" />
            <path d="M6.14648 4.5L1.64648 9" stroke="#3B8BEA"
              style="stroke:#3B8BEA;stroke:color(display-p3 0.2314 0.5451 0.9176);stroke-opacity:1;" stroke-width="1.5"
              stroke-linecap="square" stroke-linejoin="round" />
          </svg>
          <span class="text-base leading-[150%] font-semibold">Назад</span>
        </a>
      </div>
    </section>
    <section class="pt-[31px] pb-16 lg:pt-6 lg:pb-8 md:pt-[18px] md:overflow-hidden md:pb-0">
      <div class="my-container">
        <div class="flex flex-col items-center gap-4 mb-[31px] lg:mb-8 lg:gap-3">
          <h1 class="text-[34px] leading-[130%] font-bold text-center text-[#3B8BEA] lg:text-[30px] md:text-2xl">
            Зарегистрируйте личный кабинет
          </h1>
          <div class="text-lg leading-[140%] text-center font-medium lg:text-base">
            или <a href="#" class="text-[#3B8BEA] font-semibold">войдите в аккаунт</a>
          </div>
        </div>
        <form class="max-w-[568px] w-full mx-auto bg-white rounded-3xl p-6 md:p-0 md:rounded-none md:pb-[42px]">
          <div class="flex flex-col gap-5">
            <div class="w-full flex items-start flex-col gap-2">
              <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Имя</label>
              <input type="text" placeholder="Имя"
                class="block w-full px-4 py-[17px] bg-[#F4F6FB] border-[1px] border-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
            </div>
            <div class="w-full flex items-start flex-col gap-2">
              <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Фамилия</label>
              <input type="text" placeholder="Фамилия"
                class="block w-full px-4 py-[17px] bg-[#F4F6FB] border-[1px] border-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
            </div>
            <div class="w-full flex items-start flex-col gap-2">
              <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Электронный адрес</label>
              <input type="email" placeholder="Электронный адрес"
                class="block w-full px-4 py-[17px] bg-[#F4F6FB] border-[1px] border-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
            </div>
            <div class="w-full flex items-start flex-col gap-2">
              <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Номер телефона</label>
              <input type="tel" placeholder="Номер телефона"
                class="block w-full px-4 py-[17px] bg-[#F4F6FB] border-[1px] border-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
            </div>
            <div class="w-full flex items-start flex-col gap-2">
              <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Наименование организации</label>
              <input type="text" placeholder="Наименование организации"
                class="block w-full px-4 py-[17px] bg-[#F4F6FB] border-[1px] border-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
            </div>
            <div class="w-full flex items-start flex-col gap-2">
              <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">ИНН организации</label>
              <input type="text" placeholder="ИНН организации"
                class="block w-full px-4 py-[17px] bg-[#F4F6FB] border-[1px] border-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
            </div>
          </div>
          <div class="flex flex-col gap-5 mt-11">
            <div>
              <div class="relative w-full flex items-start flex-col gap-2">
                <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Пароль</label>
                <input type="password" placeholder="Введите пароль"
                  class="block w-full px-4 py-[17px] pr-12 bg-[#F4F6FB] border-[1px] border-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
                <button type="button"
                  class="absolute top-[45px] right-4 size-6 flex items-center justify-center cursor-pointer">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                      d="M3.57293 2.40002L2.25391 3.69753L19.2275 20.4L20.5465 19.1021L3.57293 2.40002Z" fill="#5A5B5F"
                      style="fill:#5A5B5F;fill:color(display-p3 0.3529 0.3569 0.3725);fill-opacity:1;" />
                    <path
                      d="M5.0396 6.4396L6.28112 7.66125C4.92205 8.79992 3.83983 10.2173 3.14049 11.4574L3.13836 11.4616C5.08603 14.666 8.17639 17.6943 12.0768 17.235C13.1297 17.1109 14.1118 16.7568 15.0092 16.2501L16.266 17.4864C14.5168 18.5912 12.5117 19.1762 10.3391 18.887C6.42167 18.3657 3.21843 15.2041 1.19922 11.4909C2.14728 9.6138 3.44416 7.81799 5.0396 6.4396ZM7.86336 4.62912C8.95878 4.14884 10.1441 3.86637 11.4099 3.84626C11.4801 3.84584 12.3145 3.88481 12.6927 3.946C12.9299 3.98456 13.1663 4.03275 13.3993 4.09268C17.1153 5.04528 19.8683 8.1365 21.5992 11.3212C20.8731 12.7641 19.922 14.1723 18.7878 15.3788L17.5838 14.1941C18.4215 13.3056 19.12 12.3165 19.6579 11.3572C19.6579 11.3572 19.117 10.5014 18.7069 9.96416C18.4433 9.61883 18.166 9.28356 17.8747 8.96044C17.6447 8.70563 16.7516 7.8402 16.539 7.65999C15.1131 6.45343 13.4389 5.5067 11.4307 5.52262C10.653 5.53478 9.90514 5.68565 9.19516 5.93962L7.86336 4.62912Z"
                      fill="#5A5B5F" style="fill:#5A5B5F;fill:color(display-p3 0.3529 0.3569 0.3725);fill-opacity:1;" />
                    <path fill-rule="evenodd" clip-rule="evenodd"
                      d="M8.4188 9.76562L9.37721 10.7083L13.0663 14.3383C12.5731 14.6107 12.0041 14.7658 11.3989 14.7658C9.51423 14.7658 7.98438 13.2604 7.98438 11.4059C7.98438 10.8104 8.14239 10.2509 8.4188 9.76562ZM11.3358 8.04692C11.3567 8.0465 11.378 8.04608 11.3989 8.04608C13.2835 8.04608 14.8133 9.55188 14.8133 11.4059C14.8133 11.4269 14.8133 11.4474 14.8129 11.468L11.3358 8.04692Z"
                      fill="#5A5B5F" style="fill:#5A5B5F;fill:color(display-p3 0.3529 0.3569 0.3725);fill-opacity:1;" />
                  </svg>
                </button>
              </div>
              <div class="pl-4 pt-1">
                <ul class="flex flex-col gap-[2px] list-disc pl-4">
                  <li class="text-xs leading-[140%] text-[#5A5B5F]">8 и более символов</li>
                  <li class="text-xs leading-[140%] text-[#5A5B5F]">Строчные и прописные латинские буквы</li>
                  <li class="text-xs leading-[140%] text-[#5A5B5F]">Цифры</li>
                </ul>
              </div>
            </div>
            <div class="relative w-full flex items-start flex-col gap-2">
              <label for="" class="text-[#323338] text-sm leading-[140%] font-medium">Подтверждение пароля</label>
              <input type="password" placeholder="Введите пароль"
                class="block w-full px-4 py-[17px] pr-12 bg-[#F4F6FB] border-[1px] border-[#F4F6FB] text-[#323338] text-[15px] leading-[147%] font-medium rounded-2xl outline-none">
              <button type="button"
                class="absolute top-[45px] right-4 size-6 flex items-center justify-center cursor-pointer">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M3.57293 2.40002L2.25391 3.69753L19.2275 20.4L20.5465 19.1021L3.57293 2.40002Z" fill="#5A5B5F"
                    style="fill:#5A5B5F;fill:color(display-p3 0.3529 0.3569 0.3725);fill-opacity:1;" />
                  <path
                    d="M5.0396 6.4396L6.28112 7.66125C4.92205 8.79992 3.83983 10.2173 3.14049 11.4574L3.13836 11.4616C5.08603 14.666 8.17639 17.6943 12.0768 17.235C13.1297 17.1109 14.1118 16.7568 15.0092 16.2501L16.266 17.4864C14.5168 18.5912 12.5117 19.1762 10.3391 18.887C6.42167 18.3657 3.21843 15.2041 1.19922 11.4909C2.14728 9.6138 3.44416 7.81799 5.0396 6.4396ZM7.86336 4.62912C8.95878 4.14884 10.1441 3.86637 11.4099 3.84626C11.4801 3.84584 12.3145 3.88481 12.6927 3.946C12.9299 3.98456 13.1663 4.03275 13.3993 4.09268C17.1153 5.04528 19.8683 8.1365 21.5992 11.3212C20.8731 12.7641 19.922 14.1723 18.7878 15.3788L17.5838 14.1941C18.4215 13.3056 19.12 12.3165 19.6579 11.3572C19.6579 11.3572 19.117 10.5014 18.7069 9.96416C18.4433 9.61883 18.166 9.28356 17.8747 8.96044C17.6447 8.70563 16.7516 7.8402 16.539 7.65999C15.1131 6.45343 13.4389 5.5067 11.4307 5.52262C10.653 5.53478 9.90514 5.68565 9.19516 5.93962L7.86336 4.62912Z"
                    fill="#5A5B5F" style="fill:#5A5B5F;fill:color(display-p3 0.3529 0.3569 0.3725);fill-opacity:1;" />
                  <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M8.4188 9.76562L9.37721 10.7083L13.0663 14.3383C12.5731 14.6107 12.0041 14.7658 11.3989 14.7658C9.51423 14.7658 7.98438 13.2604 7.98438 11.4059C7.98438 10.8104 8.14239 10.2509 8.4188 9.76562ZM11.3358 8.04692C11.3567 8.0465 11.378 8.04608 11.3989 8.04608C13.2835 8.04608 14.8133 9.55188 14.8133 11.4059C14.8133 11.4269 14.8133 11.4474 14.8129 11.468L11.3358 8.04692Z"
                    fill="#5A5B5F" style="fill:#5A5B5F;fill:color(display-p3 0.3529 0.3569 0.3725);fill-opacity:1;" />
                </svg>
              </button>
            </div>
          </div>
          <button class="w-full mt-6 flex items-center justify-center gap-2 p-5 rounded-2xl bg-[#3B8BEA] 
                font-semibold text-white cursor-pointer hover:bg-[#2C6CB8] transition-all
                md:max-w-full md:w-full md:py-[15px]">Зарегистрироваться</button>
        </form>
      </div>
    </section>
  </main>
  @@include('footer.html')
  @@include('scripts.html')
</body>

</html>
